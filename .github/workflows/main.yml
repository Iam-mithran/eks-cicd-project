# STEP 4 — Run the tests, and keep the evidence.
#
# 🎯 GOAL: this is the gate that gives a green tick meaning. Everything before
#          it was housekeeping.
#
# Three things worth copying into any real pipeline:
#
#   1. A MATRIX — the same suite on 3.11 and 3.12 at the same time. Version-
#      specific breakage shows up here instead of in production.
#   2. "if: always()" on the report upload — you need the test report most
#      when the tests FAILED, and a normal step is SKIPPED after a failure.
#   3. ARTIFACTS — the runner is destroyed when the job ends. Anything you
#      want to look at afterwards has to be uploaded first.
#
# ▶️ TRY IT: change an assertion in tests/test_tasks.py so it fails. Watch the
#    job go red, then download the artifact and read the JUnit XML.
#
# 👀 OBSERVE: both matrix jobs run in parallel; the coverage number appears on
#    the run's summary page without you opening a single log.

name: Step 4 - Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # Do NOT cancel the 3.12 job because 3.11 failed — you want the full
      # picture from one run, not one failure at a time.
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest with coverage
        run: |
          mkdir -p reports
          pytest \
            --junitxml=reports/junit.xml \
            --cov=app \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=term-missing \
            | tee reports/pytest-output.txt

      - name: Publish the result to the run summary
        # $GITHUB_STEP_SUMMARY is markdown rendered on the run's front page.
        # Use it for the numbers a human wants at a glance.
        if: always()
        run: |
          {
            echo "### 🧪 Tests on Python ${{ matrix.python-version }}"
            echo ""
            echo "Result: **${{ job.status }}**"
            echo ""
            grep -E "^(TOTAL|=+ )" reports/pytest-output.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test reports
        # always() — a failed run is precisely when you need the report.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Matrix jobs all upload at once, so the name MUST be unique per job.
          # Reuse one name and the second job errors with "an artifact with
          # this name already exists".
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 7
